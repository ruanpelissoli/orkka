<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376.439 120" width="376.439" height="120" role="img" aria-label="Orkka">
  <!-- Orkka horizontal lockup.
     The wordmark is set in Unbounded Bold and stored as outlines. It must stay
     outlined: this file is loaded through <img>, which cannot reach a webfont,
     so live <text> here would silently fall back to a system face and draw the
     brand in a different typeface on every OS. Regenerate rather than edit. -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- === Icon (scaled to ~100x100) === -->
  <g transform="translate(10,10) scale(0.1875)">
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

    <!-- Orca body -->
    <path d="M140,300 
             C140,300 160,200 220,170 
             C260,150 300,145 340,155 
             C370,162 395,180 405,210 
             C415,240 410,270 390,295
             L385,290
             C385,290 370,310 350,320
             L330,328
             C310,332 280,330 260,325
             C230,318 190,310 160,308
             Z" 
          fill="#1E2D4D"/>

    <!-- Belly -->
    <path d="M165,308 
             C190,310 230,318 260,325
             C280,330 310,332 330,328
             L350,320
             C350,320 340,345 310,355
             C280,365 240,360 210,348
             C185,338 168,318 165,308
             Z" 
          fill="url(#bodyGrad)"/>

    <!-- Dorsal fin -->
    <path d="M280,170 C280,170 275,110 310,90 C310,90 305,130 320,155 Z" fill="#1E2D4D"/>

    <!-- Tail flukes -->
    <path d="M140,300 C140,300 110,290 90,270 C90,270 100,300 115,310 Z" fill="#1E2D4D"/>
    <path d="M140,300 C140,300 105,310 85,330 C85,330 110,320 130,312 Z" fill="#1E2D4D"/>

    <!-- Pectoral fin -->
    <path d="M290,280 C290,280 275,310 250,325 C250,325 270,315 285,295 Z" fill="#1E2D4D"/>

    <!-- Eye patch -->
    <ellipse cx="370" cy="230" rx="18" ry="12" fill="url(#accentGrad)" transform="rotate(-15,370,230)"/>

    <!-- Eye -->
    <circle cx="380" cy="225" r="5" fill="#0A0E1A"/>

    <!-- Code brackets -->
    <g fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <polyline points="400,160 388,175 400,190"/>
      <polyline points="415,160 427,175 415,190"/>
    </g>

    <!-- Bubbles -->
    <circle cx="420" cy="145" r="3" fill="#3B82F6" opacity="0.5"/>
    <circle cx="435" cy="155" r="2" fill="#60A5FA" opacity="0.4"/>
    <circle cx="410" cy="135" r="2" fill="#60A5FA" opacity="0.3"/>
  </g>

  <!-- === Lettering (outlined Unbounded Bold) === -->
  <g transform="translate(120.628 82.165) scale(0.641)">
    <path fill="#FFFFFF" d="M48.20 1.60Q34.90 1.60 24.85-3.30Q14.80-8.20 9.25-17Q3.70-25.80 3.70-37.50Q3.70-49.20 9.25-58Q14.80-66.80 24.85-71.70Q34.90-76.60 48.20-76.60Q61.60-76.60 71.60-71.70Q81.60-66.80 87.20-58Q92.80-49.20 92.80-37.50Q92.80-25.80 87.20-17Q81.60-8.20 71.60-3.30Q61.60 1.60 48.20 1.60M48.20-16.90Q55.50-16.90 60.80-19.40Q66.10-21.90 68.95-26.50Q71.80-31.10 71.80-37.50Q71.80-43.90 68.95-48.50Q66.10-53.10 60.80-55.60Q55.50-58.10 48.20-58.10Q41-58.10 35.70-55.60Q30.40-53.10 27.50-48.50Q24.60-43.90 24.60-37.50Q24.60-31.10 27.50-26.50Q30.40-21.90 35.70-19.40Q41-16.90 48.20-16.90M103.20-37.90L99.40-57.10L120.20-57.10L123.60-36.70L123.60 0L103.20 0L103.20-37.90M150.40-58L150.40-40.60Q147.40-41.20 144.75-41.45Q142.10-41.70 139.90-41.70Q135.50-41.70 131.80-39.95Q128.10-38.20 125.85-34.20Q123.60-30.20 123.60-23.50L119.70-28.30Q120.50-34.50 122.10-39.95Q123.70-45.40 126.45-49.65Q129.20-53.90 133.30-56.35Q137.40-58.80 143.30-58.80Q145-58.80 146.80-58.60Q148.60-58.40 150.40-58"/>
    <path fill="url(#accent)" d="M177.90-77L177.90-16.30L172.30-18.20L203.90-57.10L225.40-57.10L175.70 0L157.40 0L157.40-77L177.90-77M203.90 0L187.60-27.90L203-38.70L226.90 0L203.90 0M252.20-77L252.20-16.30L246.60-18.20L278.20-57.10L299.70-57.10L250 0L231.70 0L231.70-77L252.20-77M278.20 0L261.90-27.90L277.30-38.70L301.20 0L278.20 0M378.80 0L357.60 0L355-20.60L357.70-28.50L355-36.40L357.60-57.10L378.80-57.10L375.20-28.60L378.80 0M362.40-28.50Q361-19.50 356.85-12.70Q352.70-5.90 346.35-2.15Q340 1.60 331.90 1.60Q323.50 1.60 317.15-2.15Q310.80-5.90 307.20-12.75Q303.60-19.60 303.60-28.50Q303.60-37.60 307.20-44.40Q310.80-51.20 317.15-55Q323.50-58.80 331.90-58.80Q340-58.80 346.35-55.05Q352.70-51.30 356.90-44.55Q361.10-37.80 362.40-28.50M324.30-28.50Q324.30-24.30 326.05-21Q327.80-17.70 330.90-15.85Q334-14 338-14Q342.20-14 345.90-15.85Q349.60-17.70 352.40-21Q355.20-24.30 356.60-28.50Q355.20-32.80 352.40-36.10Q349.60-39.40 345.90-41.30Q342.20-43.20 338-43.20Q334-43.20 330.90-41.30Q327.80-39.40 326.05-36.10Q324.30-32.80 324.30-28.50"/>
  </g>
</svg>
