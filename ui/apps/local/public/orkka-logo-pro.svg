<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 82 344 292" width="344" height="292" role="img" aria-label="Orkka Pro">
  <!--
    The Pro mark: the Orkka orca cast in gold.

    Same silhouette as orkka-orca.svg on purpose — a plan badge showing a different animal
    would read as a different product. The code brackets and bubbles are dropped and the box
    is cropped to the creature, because this is worn at 15px in a navbar as often as it is
    shown large, and at that size they are noise.

    The glint is CSS inside the file rather than in the app stylesheet: this is loaded through
    <img>, which cannot reach the page's styles, so the animation and its reduced-motion
    opt-out both have to live here.
  -->
  <defs>
    <linearGradient id="proBody" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="35%" stop-color="#F2C542"/>
      <stop offset="70%" stop-color="#D9971E"/>
      <stop offset="100%" stop-color="#A2660C"/>
    </linearGradient>
    <linearGradient id="proBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#EBCB84"/>
    </linearGradient>
    <linearGradient id="proGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFDF0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="proSilhouette">
      <path d="M140,300 C140,300 160,200 220,170 C260,150 300,145 340,155 C370,162 395,180 405,210 C415,240 410,270 390,295 L385,290 C385,290 370,310 350,320 L330,328 C310,332 280,330 260,325 C230,318 190,310 160,308 Z"/>
      <path d="M165,308 C190,310 230,318 260,325 C280,330 310,332 330,328 L350,320 C350,320 340,345 310,355 C280,365 240,360 210,348 C185,338 168,318 165,308 Z"/>
      <path d="M280,170 C280,170 275,110 310,90 C310,90 305,130 320,155 Z"/>
      <path d="M140,300 C140,300 110,290 90,270 C90,270 100,300 115,310 Z"/>
      <path d="M140,300 C140,300 105,310 85,330 C85,330 110,320 130,312 Z"/>
      <path d="M290,280 C290,280 275,310 250,325 C250,325 270,315 285,295 Z"/>
    </clipPath>
  </defs>

  <style>
    /* Crosses in the first fifth of the cycle, then rests: a badge that shimmers without
       pause is a distraction, one that occasionally catches the light is a detail. */
    @keyframes orkka-pro-glint {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(420px); }
      100% { transform: translateX(420px); }
    }
    .glint { animation: orkka-pro-glint 4.5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .glint { animation: none; }
    }
  </style>

  <!-- Body -->
  <path d="M140,300 C140,300 160,200 220,170 C260,150 300,145 340,155 C370,162 395,180 405,210 C415,240 410,270 390,295 L385,290 C385,290 370,310 350,320 L330,328 C310,332 280,330 260,325 C230,318 190,310 160,308 Z" fill="url(#proBody)"/>

  <!-- Belly -->
  <path d="M165,308 C190,310 230,318 260,325 C280,330 310,332 330,328 L350,320 C350,320 340,345 310,355 C280,365 240,360 210,348 C185,338 168,318 165,308 Z" fill="url(#proBelly)"/>

  <!-- Dorsal fin -->
  <path d="M280,170 C280,170 275,110 310,90 C310,90 305,130 320,155 Z" fill="url(#proBody)"/>

  <!-- Tail flukes -->
  <path d="M140,300 C140,300 110,290 90,270 C90,270 100,300 115,310 Z" fill="url(#proBody)"/>
  <path d="M140,300 C140,300 105,310 85,330 C85,330 110,320 130,312 Z" fill="url(#proBody)"/>

  <!-- Pectoral fin -->
  <path d="M290,280 C290,280 275,310 250,325 C250,325 270,315 285,295 Z" fill="url(#proBody)"/>

  <!--
    The glint. Two nested groups: the animation drives a CSS transform, and the tilt is a
    presentation attribute — on one element the transform would replace the attribute and the
    band would fall straight.
  -->
  <g clip-path="url(#proSilhouette)">
    <g class="glint">
      <rect x="20" y="40" width="46" height="380" fill="url(#proGlint)" transform="rotate(18,43,230)"/>
    </g>
  </g>

  <!-- Eye patch: bronze, not the house blue, which reads as a mistake against gold -->
  <ellipse cx="370" cy="230" rx="18" ry="12" fill="#7A4E06" transform="rotate(-15,370,230)"/>

  <!-- Eye -->
  <circle cx="380" cy="225" r="5" fill="#1A1206"/>
</svg>
