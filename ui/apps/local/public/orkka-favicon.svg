           C26,17 25.5,18.5 24.5,19.5
           C23,20.5 20.5,21.5 17,21.5
           C13,21.5 9,21 7.5,20.5
           Z" 
        fill="#1E2D4D"/>

  <!-- Belly -->
  <path d="M8,20.5 
           C9,21 13,21.5 17,21.5
