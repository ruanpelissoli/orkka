<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-bottom) non-zero on iOS: the mobile tab
         bar's safe-area padding depends on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches --color-surface-app, so the browser chrome and the page are the same dark. -->
    <meta name="theme-color" content="#0b0f18" />
    <!-- Local-only: nothing here should be indexed or unfurled. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Your tracker tickets, worked by an AI dev team on this machine." />
    <link rel="icon" href="/orkka-favicon.svg" />
    <title>Orkka</title>
  </head>
  <body class="min-h-screen bg-gray-950 font-body text-gray-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
